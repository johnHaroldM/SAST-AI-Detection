name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, analyse, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate frontend routes
        run: php artisan wayfinder:generate

      # Style and static analysis.
      - name: Check code style
        run: vendor/bin/pint --test --parallel

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # Build before the Laravel test suite because Inertia views use @vite,
      # and the tests need public/build/manifest.json to exist.
      - name: Build frontend
        run: npm run build

      # The suite runs on SQLite in memory (see phpunit.xml),
      # so no database service is needed.
      - name: Tests
        run: php artisan test --compact

  self-scan:
    name: Scan our own source
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the SARIF land in the repository's Security tab.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # A security tool that will not look at itself is a bad sign.
      # Scan app/ rather than the whole tree because the test fixtures
      # contain deliberately vulnerable code used to prove the rules fire.
      - name: Scan application source
        run: |
          php artisan sast:inspect app \
            --format=sarif \
            --output=self-scan.sarif.json \
            --fail-on=CRITICAL

      - name: Upload SARIF to code scanning
        # Runs even when the gate above fails, so findings are visible
        # rather than only showing a red cross.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: self-scan.sarif.json
          category: sast-ai-detection

      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-scan-sarif
          path: self-scan.sarif.json
          retention-days: 14